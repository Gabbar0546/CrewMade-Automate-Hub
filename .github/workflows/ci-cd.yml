name: Automation Hub CI/CD

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: automation-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: automation_hub_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d automation_hub_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/automation_hub_ci
      SESSION_SECRET: ci-session-secret-change-in-production
      SESSION_COOKIE_SECURE: "true"
      CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TRANSFER_WEBHOOK_URL: https://n8n.crewmadeautomate.online/webhook/transfer-submit-to-user
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            set -e
            cd /opt/crewmade-automate-hub
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose up -d --build --remove-orphans
            docker compose ps
            for attempt in $(seq 1 30); do
              if curl -fsS --resolve app.crewmadeautomate.online:443:127.0.0.1 https://app.crewmadeautomate.online/login >/dev/null; then
                exit 0
              fi
              echo "Waiting for app health check... attempt ${attempt}/30"
              sleep 2
            done
            curl -fsS --resolve app.crewmadeautomate.online:443:127.0.0.1 https://app.crewmadeautomate.online/login >/dev/null
